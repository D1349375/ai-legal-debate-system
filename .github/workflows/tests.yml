name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tests marked `network` query law.moj.gov.tw and the Judicial Yuan's
      # FJUD service, which GitHub's overseas runners cannot reach reliably.
      # Run them locally with: python -m pytest tests/ -m network
      - name: Run the test suite
        run: python -m pytest tests/ -v -m "not network"
