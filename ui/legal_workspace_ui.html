<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalDebate AI — 律師案件工作平台</title>
  <!-- 先於繪製前套用已儲存的主題，避免閃白；讀不到(隱私模式/被封鎖)就維持預設深色 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("legaldebate-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* 存取受限時照常運作 */ }
    })();
  </script>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="shell">

  <aside class="sidebar" aria-label="案件清單">
    <div class="sidebar-logo">
      <div class="logo-icon" aria-hidden="true">法</div>
      <div>
        <div class="logo-text">LegalDebate AI</div>
        <div class="logo-sub">律師案件工作平台</div>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-section-label">案件(資料庫)</div>
      <div id="case-list"></div>
    </div>
    <div class="sidebar-foot">
      <button class="sidebar-new-btn" id="new-case-btn" type="button" disabled
              title="建立新案件並產生攻防需要 LLM(第二階段規劃，尚未提供)">＋ 建立新案件(第二階段)</button>
      <div class="sidebar-note">第一階段只重播已錄製案例並執行機械環節，不即時生成辯論。</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-case-id" id="topbar-id">—</span>
      <div>
        <div class="topbar-title" id="topbar-title">LegalDebate AI</div>
        <div class="topbar-cause" id="topbar-sub"></div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="btn icon-btn" id="theme-toggle" type="button"></button>
        <button class="btn" id="export-btn" type="button" disabled>匯出案件紀錄</button>
      </div>
    </header>

    <nav class="stage-bar" id="tabs" role="tablist" aria-label="案件分頁"></nav>

    <div class="content-area">
      <main class="panel-scroll" id="panel" role="tabpanel" tabindex="-1"></main>
      <aside class="detail-panel" id="detail" aria-label="案件資訊"></aside>
    </div>
  </div>
</div>
<noscript><div class="empty">此工作平台需要啟用 JavaScript。</div></noscript>
<script src="app.js"></script>
</body>
</html>
